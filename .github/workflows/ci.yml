name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: swift build + test (Linux, Swift 6)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      # `-warnings-as-errors` is the point: the README claims a warning-free build,
      # and a claim nobody can fail is not a claim. This step turns it into one.
      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test

  apple:
    name: build for iOS Simulator + test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The core module is platform-agnostic and is covered by the Linux job.
      # This job exists specifically so RolloutIntegrityUI — compiled out on Linux
      # by `#if canImport(SwiftUI)` — is type-checked, and so it is type-checked
      # against the *iOS* SDK rather than macOS, because iOS-only API drift is
      # exactly what a macOS-only build would miss.
      # `generic/platform=iOS Simulator` rather than a named device. Naming a
      # concrete simulator (`name=iPhone 16,OS=latest`) makes the job depend on
      # which simulator *runtimes* happen to be installed on that day's runner
      # image — and they are not guaranteed. This job only needs to type-check
      # and compile against the iOS Simulator SDK, which the generic destination
      # does without requiring any device to exist.
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme RolloutIntegrityUI \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Test (macOS)
        run: swift test
